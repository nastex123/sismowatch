server {
    listen 3000;
    server_name localhost;

    # Resolver interno de Docker DNS para actualizar dinámicamente las IPs de los contenedores
    resolver 127.0.0.11 valid=5s ipv6=off;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy a la API backend
    location /api/ {
        set $api_backend http://api:8000;
        proxy_pass $api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
    }

    # Proxy para SSE (desactivar buffer para streaming en vivo)
    location /api/stream {
        set $api_backend http://api:8000;
        proxy_pass $api_backend/api/stream$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    # Proxy para autenticación
    location /auth/ {
        set $api_backend http://api:8000;
        proxy_pass $api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
